<!DOCTYPE html>
<html lang="ko" data-mode="stage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="인라인 스피드 대회 실시간 공개 전광판" />
    <title>실시간 전광판</title>
    <!-- 외부 폰트·스크립트 없음. 대회장 회선이 끊겨도 그대로 뜬다. -->
    <!-- theme.css 는 로컬 파일이라 외부 요청을 만들지 않는다. -->
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="board.css?v=s7" />
    <link rel="stylesheet" href="race-theme.css?v=s7" />
    <link rel="stylesheet" href="../public/campaign-type.css" />
    <link rel="icon" href="../public/mark.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app">
      <!-- ═══════════════════════════════════════════════ 헤더 -->
      <header class="hd">
        <div class="hd-meet">
          <a class="hd-home-link" href="../public/" aria-label="대회 홈으로"><img class="hd-mark" src="mark.png" alt="충청남도롤러스포츠연맹 마크" /></a>
          <div class="hd-meet-copy">
            <div class="hd-title" id="meet-title">&nbsp;</div>
            <div class="hd-sub">
              <span id="meet-date"></span>
              <span id="meet-place"></span>
              <span id="source-label"></span>
            </div>
          </div>
        </div>
        <div class="hd-right">
          <span class="demo-flag" id="demo-flag" hidden>
            <span class="dot" aria-hidden="true"></span>
            시연 데이터<span class="long"> · 실제 기록 아님</span>
          </span>
          <!-- 실기록 모드인데 아직 기록이 없을 때. 고장이 아니라 대회 시작 전이라는 뜻. -->
          <span class="wait-flag" id="wait-flag" hidden>
            <span class="dot" aria-hidden="true"></span>
            기록 대기 중
          </span>
          <span class="clock" id="clock" aria-label="현재 시각">--:--:--</span>
        </div>
      </header>

      <!-- ═══════════════════════════════════════════ 종목 헤드 -->
      <section class="evbar" aria-label="현재 종목">
        <div class="ev-no" id="ev-no">--</div>
        <div class="ev-main">
          <h1 class="ev-name" id="ev-name">불러오는 중</h1>
          <div class="ev-meta" id="ev-meta"></div>
        </div>
        <div
          class="gauge"
          id="gauge"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="gauge-text">
            <span id="gauge-status">대기</span>
            <span id="gauge-done">0 / 0</span>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill" id="gauge-fill" style="width: 0%"></div>
            <div class="gauge-ticks" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="race-state" id="race-state" aria-live="polite">
        <div class="race-state-main">
          <span class="race-state-dot" aria-hidden="true"></span>
          <span>
            <strong id="race-state-title">기록 대기</strong>
            <small id="race-state-copy">출전 명단을 표시하고 있습니다.</small>
          </span>
        </div>
        <strong class="race-state-count" id="race-state-count">0 / 0</strong>
      </section>

      <!-- ══════════════════════════════════════ 탭 (관중 폰) -->
      <nav class="tabs" id="tabs" role="tablist" aria-label="화면 선택" hidden>
        <button class="tab" id="tab-lanes" role="tab" data-tab="lanes" aria-selected="true" aria-controls="panel-lanes">
          진행 중인 조
        </button>
        <button class="tab" id="tab-heatranks" role="tab" data-tab="heatranks" aria-selected="false" aria-controls="panel-heatranks" tabindex="-1">
          조 순위
        </button>
        <button class="tab" id="tab-overall" role="tab" data-tab="overall" aria-selected="false" aria-controls="panel-overall" tabindex="-1">
          종목 순위
        </button>
        <button class="tab" id="tab-next" role="tab" data-tab="next" aria-selected="false" aria-controls="panel-next" tabindex="-1">
          다음 경기
        </button>
      </nav>

      <!-- ═══════════════════════════════════════════════ 본문 -->
      <main class="main">
        <!-- 진행 중인 조 : 레인 순 -->
        <section class="panel" id="panel-lanes" aria-labelledby="lanes-title">
          <div class="panel-hd">
            <div class="panel-t">
              <span id="lanes-title">--</span>
              <span class="kicker" id="lanes-order">레인 순</span>
              <span class="kicker" id="lanes-sub"></span>
            </div>
            <div id="lanes-badges" style="display: flex; gap: 6px; align-items: center"></div>
          </div>
          <div class="panel-body">
            <div class="focus-columns" aria-hidden="true"><span>순위</span><span>배번</span><span>이름</span><span>기록</span></div>
            <!-- aria-live 를 명시적으로 꺼 둔다. 실시간 갱신은 아래 status 한 곳으로만 나간다. -->
            <ol class="lanes" id="lanes" aria-live="off"></ol>
          </div>
        </section>

        <!-- 조 순위 (관중 폰 전용 탭) -->
        <section class="panel" id="panel-heatranks" hidden aria-labelledby="tab-heatranks">
          <div class="panel-body" id="heatranks" aria-live="off"></div>
        </section>

        <div class="col-side">
          <!-- 종목 전체 순위 -->
          <section class="panel" id="panel-overall" aria-labelledby="overall-title">
            <div class="panel-hd">
              <div class="panel-t">
                <span id="overall-title">종목 전체 순위</span>
                <span class="kicker" id="overall-sub"></span>
              </div>
            </div>
            <div class="panel-body" id="overall" aria-live="off"></div>
          </section>

          <!-- 다음 경기 -->
          <section class="panel" id="panel-next" aria-labelledby="next-title">
            <div class="panel-hd">
              <div class="panel-t"><span id="next-title">다음 경기</span></div>
            </div>
            <div class="panel-body" id="upnext"></div>
          </section>
        </div>
      </main>
      <p class="focus-signature" aria-hidden="true">SPEED<br>SPIRIT<br>CHUNGNAM</p>

      <!-- ═══════════════════════════════════════════════ 푸터 -->
      <footer class="ft">
        <span class="prov">잠정</span>
        <span
          >심판 확정 전 기록입니다. 확정 전에는 순위가 바뀔 수 있습니다.</span
        >
        <span id="demo-foot" hidden style="color: var(--prov)"
          >· 지금 보이는 기록은 시연용으로 만들어 낸 값입니다.</span
        >

        <span class="ft-spacer"></span>

        <div class="ft-ctrls">
        <div id="stage-controls" style="display: flex; gap: 6px">
          <button class="btn" id="btn-prev" type="button" aria-label="이전 조 보기">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="btn" id="btn-next" type="button" aria-label="다음 조 보기">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="btn" id="btn-cycle" type="button" aria-pressed="true">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2" stroke-linecap="round" />
              <path d="M18 3v3h-3M6 21v-3h3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span id="btn-cycle-label">자동 순환 켜짐</span>
          </button>
        </div>

        <button class="btn" id="pick-event" type="button">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" />
          </svg>
          종목 선택
        </button>
        <button class="btn" id="back-live" type="button" hidden>지금 경기로</button>
        <button class="btn" id="btn-announce" type="button" aria-pressed="true">
          <span id="btn-announce-label">읽어주기 켜짐</span>
        </button>
        <button class="btn" id="btn-mode" type="button">
          <span id="btn-mode-label">관중 폰으로</span>
        </button>
        <button class="btn" id="btn-layout" type="button" aria-pressed="false">간결하게</button>
        <a class="btn" href="../public/" id="go-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5M6 10.5V19h12v-8.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          대회 홈
        </a>
        </div>
      </footer>
    </div>

    <!-- ═══════════════════════════════════════ 종목 선택 시트 -->
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-hd">
        <h2 id="sheet-title">종목 선택</h2>
        <button class="btn sheet-close" id="sheet-close" type="button" aria-label="닫기">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>

    <!-- 실시간 갱신 알림은 오직 여기로만 나간다 (5초에 한 번, 문장으로) -->
    <p id="live-region" class="sr-only" role="status" aria-atomic="true"></p>

    <script src="../public/catalog-data.js?v=cat1"></script>
    <script src="../public/catalog.js?v=cat1"></script>
    <!-- 계산 로직은 공용이다. 전광판과 심판 콘솔이 같은 1:05.87 을 같게 해석해야 한다. -->
    <script src="../shared/calc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/live-config.js"></script>
    <script src="../shared/adapter-supabase.js"></script>
    <script src="../shared/legacy-bridge.js"></script>
    <script src="data-source.js"></script>
    <script src="../public/site-data.js"></script>
    <script src="board.js?v=s7"></script>
  </body>
</html>
